<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruiter | WinZ GoldenMiles</title><link rel="stylesheet" href="style.css">
<style>.grid3{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}@media(min-width:700px){.grid3{grid-template-columns:repeat(3,1fr)}}.tabs{flex-wrap:wrap}.tabs button{min-width:80px}a.tag,button.tag{border:0;font-family:inherit;cursor:pointer;font-size:12px}</style></head><body>
<header></header>
<main><div class="wrap" style="max-width:980px">
  <h1>Recruitment command center</h1>
  <div class="tabs">
    <button class="btn sm" id="b-overview">Overview</button><button class="btn sm out" id="b-leads">Leads</button><button class="btn sm out" id="b-jobs">Jobs</button><button class="btn sm out" id="b-talent">Talent</button><button class="btn sm out" id="b-team" style="display:none">Team</button>
  </div>
  <p class="meta" id="err"></p>
  <div id="t-overview"></div><div id="t-leads" style="display:none"></div><div id="t-jobs" style="display:none"></div>
  <div id="t-team" style="display:none"></div>
  <div id="t-talent" style="display:none">
    <form id="tf" class="card">
      <div class="two"><div><label>Skills (comma separated, all required)</label><input name="skills" placeholder="e.g. accounting, cpa"></div><div><label>Location</label><input name="location"></div></div>
      <div class="two"><div><label>Min. years of experience</label><input name="min_years" type="number" min="0"></div>
      <div><label>Availability</label><select name="availability"><option value="">Any</option><option value="available">Available now</option><option value="open_to_offers">Open to offers</option><option value="not_looking">Not looking</option></select></div></div>
      <label>Keyword (headline or summary)</label><input name="q">
      <p style="margin-top:12px"><button class="btn">Search talent pool</button></p>
    </form>
    <div id="tr"></div>
  </div>
</div></main>
<script src="app.js"></script>
<script>
hdr();
if(!tok())location.href='login.html?next=recruiter.html';
let ME=null,STAFF=[];
const LS=['new','contacted','quoted','won','lost'];
const AS=['applied','screening','shortlisted','interview','offer','hired','rejected'];
const TABS=['overview','leads','jobs','talent','team'];
const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.charAt(0)==='0')d='256'+d.slice(1);return d};
const contact=(phone,email)=>(phone?`<a class="tag" href="tel:${esc(phone)}">Call</a><a class="tag" href="https://wa.me/${wa(phone)}" target="_blank" rel="noopener">WhatsApp</a>`:'')+(email?`<a class="tag" href="mailto:${esc(email)}">Email</a>`:'');
const opts=(arr,sel)=>arr.map(v=>`<option value="${v}"${v===sel?' selected':''}>${v}</option>`).join('');
const tags=a=>(a||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('');
const num=v=>v==null?'':v;

async function dlFile(id){
  const r=await fetch(API+'/api/files/'+id,{headers:{Authorization:'Bearer '+tok()}});
  if(!r.ok)return alert('Could not download the file.');
  const ct=r.headers.get('Content-Type')||'';
  const ext=ct.indexOf('pdf')>-1?'.pdf':ct.indexOf('wordprocessingml')>-1?'.docx':'.doc';
  const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='cv'+ext;a.click();
}
const cvBtns=root=>root.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>dlFile(b.dataset.cv));
const cvBtn=id=>id?`<button class="tag" data-cv="${id}">CV</button>`:'';

async function loadOverview(){
  const s=await api('/api/admin/stats');
  const items=[['New leads',s.new_leads],['Total leads',s.total_leads],['Open jobs',s.open_jobs],['Applications',s.applications],['Candidates',s.candidates],['Employers',s.employers]];
  $('#t-overview').innerHTML='<div class="grid3">'+items.map(([l,v])=>`<div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800">${v}</div><div class="meta">${l}</div></div>`).join('')+'</div>';
}

const upLead=async(id,b)=>{try{await api('/api/admin/leads/'+id,{method:'PUT',body:b})}catch(e){alert(e.message)}};
async function loadLeads(){
  const box=$('#t-leads');
  if(!$('#lf')){
    box.innerHTML=`<div class="two"><div><label>Show</label><select id="lf"><option value="">All leads</option>${opts(LS,'')}</select></div></div><div id="ll"></div>`;
    $('#lf').onchange=loadLeads;
  }
  const st=$('#lf').value;
  const {leads}=await api('/api/admin/leads?limit=100'+(st?'&status='+st:''));
  $('#ll').innerHTML=leads.length?leads.map(l=>`<div class="card">
    <div class="row" style="border:0;padding:0"><div><b>${esc(l.company_name)}</b><div class="meta">${esc(l.contact_name)} &middot; ${esc(String(l.created_at).slice(0,10))}</div></div>
    <select data-ls="${l.id}" style="width:auto">${opts(LS,l.status)}</select></div>
    <p style="margin:8px 0"><b>${esc(l.job_title)}</b> x${esc(l.positions)} &middot; ${esc(l.location||'')}${l.industry?' &middot; '+esc(l.industry):''}</p>
    ${l.notes?`<p class="meta pre">${esc(l.notes)}</p>`:''}
    <p style="margin:8px 0">${contact(l.phone,l.email)}</p>
    <label>Assigned to</label><select data-la="${l.id}"><option value="">Unassigned</option>${STAFF.map(s=>`<option value="${s.id}"${s.id===l.assigned_to?' selected':''}>${esc(s.full_name)}</option>`).join('')}</select></div>`).join(''):'<p class="meta">No leads here.</p>';
  document.querySelectorAll('[data-ls]').forEach(s=>s.onchange=()=>upLead(s.dataset.ls,{status:s.value}));
  document.querySelectorAll('[data-la]').forEach(s=>s.onchange=()=>{if(s.value)upLead(s.dataset.la,{assigned_to:s.value})});
}

const jobBtns=j=>{
  const b=[];
  if(j.status==='draft'||j.status==='paused')b.push(['Open','open',0]);
  if(j.status==='open')b.push(['Pause','paused',1]);
  if(j.status!=='closed')b.push(['Close','closed',1]);else b.push(['Reopen','open',1]);
  return b.map(([t,s,o])=>`<button class="btn sm${o?' out':''}" data-js="${j.id}:${s}">${t}</button>`).join(' ');
};
async function showApps(id){
  const box=$('#a-'+id);
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML='<p class="meta">Loading...</p>';
  const {applications:a}=await api(`/api/jobs/${id}/applications`);
  box.innerHTML=a.length?a.map(x=>`<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.full_name)}</b>
    <div class="meta">${esc(x.headline||'')} &middot; ${esc(x.location||'')} &middot; ${esc(num(x.years_experience))} yrs</div></div>
    <select data-as="${x.id}" style="width:auto">${opts(AS,x.status)}</select></div>
    <p>${tags(x.skills)}</p>${x.cover_note?`<p class="meta pre">${esc(x.cover_note)}</p>`:''}
    <p>${contact(x.phone,x.email)}${cvBtn(x.cv_file_id)}</p></div>`).join(''):'<p class="meta">No applications yet.</p>';
  box.querySelectorAll('[data-as]').forEach(s=>s.onchange=async()=>{
    try{await api('/api/applications/'+s.dataset.as,{method:'PUT',body:{status:s.value}})}catch(e){alert(e.message)}
  });
  cvBtns(box);
}
async function loadJobs(){
  const {jobs}=await api('/api/admin/jobs');
  $('#t-jobs').innerHTML=jobs.length?jobs.map(j=>`<div class="card"><div class="row" style="border:0;padding:0">
    <div><b>${esc(j.title)}</b><div class="meta">${esc(j.company||'Agency-posted')} &middot; ${esc(j.location||'')}</div></div>
    <span class="tag">${j.status==='draft'?'pending approval':esc(j.status)}</span></div>
    <p class="meta" style="margin:8px 0">${j.applications} applications &middot; ${j.shortlisted} shortlisted</p>
    <p>${jobBtns(j)} <button class="btn sm out" data-ja="${j.id}">Applications</button></p><div id="a-${j.id}"></div></div>`).join(''):'<p class="meta">No jobs yet.</p>';
  document.querySelectorAll('[data-js]').forEach(b=>b.onclick=async()=>{
    const [id,st]=b.dataset.js.split(':');
    try{await api('/api/jobs/'+id,{method:'PUT',body:{status:st}});loadJobs()}catch(e){alert(e.message)}
  });
  document.querySelectorAll('[data-ja]').forEach(b=>b.onclick=()=>showApps(b.dataset.ja));
}

$('#tf').onsubmit=async e=>{
  e.preventDefault();
  const p=new URLSearchParams();
  new FormData(e.target).forEach((v,k)=>{if(v)p.set(k,v)});
  try{
    const {candidates:c}=await api('/api/candidates?'+p.toString());
    $('#tr').innerHTML=c.length?c.map(x=>`<div class="card"><b>${esc(x.full_name)}</b>
      <div class="meta">${esc(x.headline||'')} &middot; ${esc(x.location||'')} &middot; ${esc(num(x.years_experience))} yrs &middot; ${esc(x.availability)}</div>
      <p style="margin:8px 0">${tags(x.skills)}</p><p>${contact(x.phone,x.email)}${cvBtn(x.cv_file_id)}</p></div>`).join(''):'<p class="meta">No candidates match.</p>';
    cvBtns($('#tr'));
  }catch(err){$('#err').textContent=err.message}
};

function showPw(pw,email,phone,name){
  const link=location.origin+location.pathname.replace(/[^\/]*$/,'')+'login.html';
  const text='Hi '+name+', your WinZ GoldenMiles staff account is ready.\nLogin: '+link+'\nEmail: '+email+'\nTemporary password: '+pw+'\nYou will be asked to set your own password when you sign in.';
  $('#pw').innerHTML='<div class="msg ok" style="display:block"><b>Temporary password (shown once):</b> <code style="font-size:16px">'+esc(pw)+'</code><p style="margin-top:8px">'+(phone?'<a class="tag" target="_blank" rel="noopener" href="https://wa.me/'+wa(phone)+'?text='+encodeURIComponent(text)+'">Send via WhatsApp</a>':'')+'<button class="tag" id="cpb">Copy message</button></p></div>';
  $('#cpb').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(text);$('#cpb').textContent='Copied'};
  $('#pw').scrollIntoView();
}
async function loadTeam(){
  const box=$('#t-team'),isAdmin=ME.role==='admin';
  if(!$('#tm')){
    box.innerHTML='<div class="card"><h2>Onboard a team member</h2><form id="tm">'+
      '<div class="two"><div><label>Full name</label><input name="full_name" required></div><div><label>Role name (e.g. Senior Recruiter, HR Consultant)</label><input name="title" required></div></div>'+
      '<div class="two"><div><label>Email</label><input name="email" type="email" required></div><div><label>Phone / WhatsApp</label><input name="phone"></div></div>'+
      (isAdmin?'<label><input type="checkbox" name="can_onboard" style="width:auto"> Allowed to onboard other team members</label>':'')+
      '<p style="margin-top:12px"><button class="btn">Onboard</button></p><div class="msg" id="tmm"></div></form><div id="pw" style="margin-top:12px"></div></div>'+
      '<h2 style="margin:18px 0 10px">Team</h2><div id="tl"></div>'+
      (isAdmin?'<h2 style="margin:18px 0 10px">Recent activity</h2><div class="card" id="al"></div>':'');
    $('#tm').onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const body={full_name:f.get('full_name'),title:f.get('title'),email:f.get('email'),phone:f.get('phone'),can_onboard:f.get('can_onboard')==='on'};
      try{
        const d=await api('/api/admin/team',{method:'POST',body});
        e.target.reset();showPw(d.temp_password,d.user.email,d.user.phone,d.user.full_name);loadTeam();
      }catch(err){msg($('#tmm'),err.message,false)}
    };
  }
  const {team}=await api('/api/admin/team');
  const T={};team.forEach(t=>{T[t.id]=t});
  $('#tl').innerHTML=team.map(t=>'<div class="card"><div class="row" style="border:0;padding:0"><div><b>'+esc(t.full_name)+'</b><div class="meta">'+esc(t.title||'')+' &middot; '+esc(t.email)+(t.phone?' &middot; '+esc(t.phone):'')+'</div></div><span class="tag">'+(t.status!=='active'?'disabled':(t.role==='admin'?'admin':'staff'))+'</span></div>'+
    '<p class="meta" style="margin:6px 0">'+((t.can_onboard||t.role==='admin')?'Can onboard others':'Cannot onboard others')+(t.must_change_password?' &middot; has not set their own password yet':'')+'</p>'+
    ((isAdmin&&t.id!==ME.id)?'<p><button class="btn sm out" data-tg="'+t.id+':onb">'+(t.can_onboard?'Remove onboarding right':'Allow onboarding')+'</button> <button class="btn sm out" data-tg="'+t.id+':st">'+(t.status==='active'?'Disable':'Enable')+'</button> <button class="btn sm out" data-tg="'+t.id+':pw">Reset password</button>'+(t.role!=='admin'?' <button class="btn sm out" data-tg="'+t.id+':adm">Make admin</button>':'')+'</p>':'')+'</div>').join('');
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{
    const [id,act]=b.dataset.tg.split(':'),t=T[id];
    try{
      if(act==='pw'){
        if(!confirm('Reset the password for '+t.full_name+'?'))return;
        const d=await api('/api/admin/team/'+id+'/reset-password',{method:'POST',body:{}});
        showPw(d.temp_password,t.email,t.phone,t.full_name);return;
      }
      if(act==='adm'&&!confirm('Make '+t.full_name+' a full admin? Admins can onboard staff and manage permissions.'))return;
      const body=act==='onb'?{can_onboard:!t.can_onboard}:act==='st'?{status:t.status==='active'?'disabled':'active'}:{role:'admin'};
      await api('/api/admin/team/'+id,{method:'PUT',body});loadTeam();
    }catch(e){alert(e.message)}
  });
  if(isAdmin){
    const {log}=await api('/api/admin/audit');
    $('#al').innerHTML=log.length?log.map(l=>'<div class="row"><div>'+esc(l.actor||'?')+' &middot; '+esc(l.action)+(l.target?' &middot; '+esc(l.target):'')+'</div><span class="meta">'+esc(String(l.created_at).slice(0,16))+'</span></div>').join(''):'<p class="meta">Nothing yet.</p>';
  }
}
const LOAD={overview:loadOverview,leads:loadLeads,jobs:loadJobs,team:loadTeam};
function tab(t){
  TABS.forEach(x=>{$('#t-'+x).style.display=x===t?'':'none';$('#b-'+x).className='btn sm'+(x===t?'':' out')});
  $('#err').textContent='';
  if(LOAD[t])LOAD[t]().catch(e=>{$('#err').textContent=e.message});
}
TABS.forEach(t=>$('#b-'+t).onclick=()=>tab(t));

(async()=>{
  try{
    ME=(await api('/api/me')).user;
    if(ME.role!=='recruiter'&&ME.role!=='admin'){location.href='dashboard.html';return}
    if(ME.must_change_password){location.href='account.html?force=1';return}
    if(ME.role==='admin'||ME.can_onboard)$('#b-team').style.display='';
    STAFF=(await api('/api/admin/staff')).staff;
    tab('overview');
  }catch(e){$('#err').textContent=e.message}
})();
</script></body></html>
